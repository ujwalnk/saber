name: Build for macOS

on:
  # Enable manual run
  workflow_dispatch:
  # Called by release.yml
  workflow_call:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Xcode
        run: |
          echo "Selecting Xcode 26.3..."
          echo /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcode-select -p
          echo

          echo "Running Xcode first launch..."
          xcodebuild -runFirstLaunch
          echo

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          cache-flutter: false
          cache-pub: false
          no-save-caches: true

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - name: Build for macOS
        run: flutter build macos

      - name: Compress macOS build
        id: compress
        run: |
          # BSD grep has no -P, so use sed instead
          buildName=$(sed -n "s/.*buildName = '\(.*\)'.*/\1/p" lib/data/version.dart)
          zipName="Saber_v${buildName}.app.zip"
          echo "zipName=$zipName" >> $GITHUB_OUTPUT

          # ditto keeps symlinks inside the .app bundle intact (plain `zip -r` doesn't)
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Saber.app \
            "$zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: ${{ steps.compress.outputs.zipName }}