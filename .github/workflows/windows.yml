name: Build for Windows

on:
  # Enable manual run
  workflow_dispatch:
  # Called by release.yml
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/
            .flutter-plugins-dependencies
            build/
            linux/flutter/ephemeral/
            macos/Flutter/ephemeral/
            packages/**/.dart_tool/
            packages/**/.flutter-plugins-dependencies
            packages/**/pubspec.lock
            windows/flutter/ephemeral/
            ~/.dartServer/
            ~/.dart-tool/
          key: ${{ runner.OS }}-saber-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-saber-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Disable Flutter CLI animations
        shell: bash
        run: flutter config --no-cli-animations

      - run: ./patches/pre/remove_permission_handler.sh
        shell: bash

      - name: Build Windows
        shell: bash
        run: flutter build windows

      - name: Download Visual C++ Redistributable
        shell: bash
        run: curl -L -o installers/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Build Windows Installer
        run: ISCC.exe installers/desktop_inno_script.iss

      - name: Rename exe
        id: rename
        shell: bash
        run: |
          export LC_ALL=en_US.utf8
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          installerName="SaberInstaller_v${buildName}.exe"
          echo "installerName=$installerName" >> $GITHUB_OUTPUT

          mv installers/SaberInstaller.exe installers/$installerName

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: installers/${{ steps.rename.outputs.installerName }}